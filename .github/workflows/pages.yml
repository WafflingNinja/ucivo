name: Deploy Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pages
        uses: actions/configure-pages@v5
      - name: Novinky (co přibylo od posledního oznámení)
        id: novinky
        continue-on-error: true
        run: |
          node .github/scripts/novinky.mjs "$GITHUB_SHA" "${{ steps.pages.outputs.base_url }}" "$RUNNER_TEMP/novinky"
          if [ "$(git status --porcelain novinky.json novinky.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add novinky.json novinky.html
            git commit -m "chore: novinky $(date +%F)"
          fi
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html novinky.html _site/
          touch _site/.nojekyll
          for d in dejepis cestina fyzika matika chemie zemepis spanelstina prirodopis; do cp -r "$d" _site/; done
          rm -f _site/cestina/cestina-puvodni-zaloha.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Uložit novinky do master
        if: steps.novinky.outputs.changed == 'true' && github.ref == 'refs/heads/master'
        run: git pull --rebase origin master && git push origin HEAD:master
      - name: Poslat odkaz pro skupinu (GitHub issue)
        if: steps.novinky.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Novinky k poslání do skupiny (${{ steps.novinky.outputs.date }})" --body-file "$RUNNER_TEMP/novinky/issue.md"
