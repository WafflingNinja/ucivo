name: Deploy Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
          for d in dejepis cestina fyzika matika chemie zemepis spanelstina; do cp -r "$d" _site/; done
          rm -f _site/cestina/cestina-puvodni-zaloha.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
